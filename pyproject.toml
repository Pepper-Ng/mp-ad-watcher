[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "marktplaats-ad-watcher"
version = "0.1.0"
description = "Poll Marktplaats searches, evaluate new ads with configurable AI providers, and notify via Telegram."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
marktplaats-ad-watcher = "marktplaats_ad_watcher.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/marktplaats_ad_watcher"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
