services:
  watcher-data-init:
    build: .
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /app/data"]
    restart: "no"
    volumes:
      - watcher-data:/app/data

  marktplaats-ad-watcher:
    build: .
    init: true
    restart: unless-stopped
    depends_on:
      watcher-data-init:
        condition: service_completed_successfully
    ports:
      - "${WATCHER_PORT:-8080}:8080"
    environment:
      WEB_ADMIN_TOKEN: ${WEB_ADMIN_TOKEN:?Set WEB_ADMIN_TOKEN before deploying}
    volumes:
      - watcher-data:/app/data
    stop_grace_period: 20s

volumes:
  watcher-data: